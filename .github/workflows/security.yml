name: Security

on: [push, pull_request]

jobs:
  package-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -e . pip-audit
      - run: pip-audit --local
